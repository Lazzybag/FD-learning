[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_dir = "cache"

# Optimization settings for testing
optimizer = true
optimizer_runs = 200

# Solidity version
solc_version = "0.8.0"

# RPC endpoints
[rpc_endpoints]
sepolia = "https://eth-sepolia.g.alchemy.com/v2/demo"
mainnet = "https://eth-mainnet.g.alchemy.com/v2/demo"

# Default network for testing
[profile.default]
fs_permissions = [{ access = "read-write", path = "./" }]
